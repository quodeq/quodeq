[project]
name = "quodeq"
version = "1.10.1"
description = "Source code quality evaluation platform powered by AI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Victor Purcallas Marchesi", email = "vpurcallas@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["code-quality", "ai", "evaluation", "iso-25010", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Lower bounds are the versions uv.lock resolves, because CI installs with
# `uv sync` and therefore only ever exercises the locked set. A floor below
# that advertises support we do not test. Upper bounds stop a fresh `uv lock`
# from crossing a major boundary unreviewed; Dependabot's uv job proposes the
# cap bump when a new major lands. 0.x deps are capped at the next minor,
# since 0.x minors are breaking under semver.
dependencies = [
    "jsonschema==4.26.0",
    "flask==3.1.3",
    "flask-sock>=0.7.0,<0.8",
    "pywebview>=6.2.1,<7",
    "openai>=2.44.0,<4",
    "httpx>=0.28.1,<0.29",
    "packaging>=26.2,<27",
    "keyring>=25.5.0,<26",
    # Imported unguarded by quodeq.core.events.models; previously present only
    # because openai depends on it. Declared so it cannot vanish underneath us.
    "pydantic>=2.13.4,<3",
    'pywinpty>=3.0.5,<4 ; sys_platform == "win32"',
    # Built-in menu bar icon (quodeq.menubar); pure Python over the
    # pyobjc-Cocoa stack pywebview already pulls in on macOS.
    'rumps>=0.4,<0.5 ; sys_platform == "darwin"',
]

[project.urls]
Homepage = "https://github.com/quodeq/quodeq"
Repository = "https://github.com/quodeq/quodeq"
Issues = "https://github.com/quodeq/quodeq/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.7",
]

[project.scripts]
quodeq = "quodeq:main"

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "tools"]
# Third-party repos vendored as an evaluator test corpus; not our code.
extend-exclude = ["tests/fixtures/discipline_corpus"]

[tool.ruff.lint]
# Deliberately narrow. Each rule here maps to a maintainability
# violation type the self-eval flags (M-ANA-10 dead code, M-ANA-9
# import placement, M-MDF-1 magic literals, M-ANA-5 missing API
# documentation). Widen one rule at a time, with the tree clean for
# that rule in the same PR, so the gate never grandfathers.
select = [
    "F401", "F821", "F841", "E402", "PLR2004", "C901", "ARG",
    # D1xx only: every public module, package, class, method and
    # function carries a docstring. The other pydocstyle families
    # (formatting, wording) are NOT selected -- they would churn the
    # existing docstrings without saying anything a reader needs.
    "D100", "D101", "D102", "D103", "D104",
]

[tool.ruff.lint.mccabe]
# M-MOD-1 cyclomatic complexity; 15 is the standard's default ceiling.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Re-export blocks placed after the accessors they depend on; moving
# them to the top would create an import cycle with the _env_* modules.
"src/quodeq/shared/env.py" = ["E402"]
"src/quodeq/shared/utils.py" = ["E402"]
# Standalone scripts that insert the repo root into sys.path first.
"tools/*.py" = ["E402"]
# Tests assert literal expectations; the literal is the contract.
# D1xx gates the public API, which is src/quodeq only: a test module is
# not importable surface, and a docstring on every test function would
# be noise rather than documentation.
# ARG: fakes, stubs and monkeypatch replacements have to match the
# signature they stand in for, so an unused parameter there is the
# point, not dead code.
"tests/**" = ["PLR2004", "ARG", "D100", "D101", "D102", "D103", "D104"]
# Standalone scripts outside the layer rules, and likewise not API.
"tools/**" = ["PLR2004", "D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "benchmarks"]
markers = [
    "integration: end-to-end tests that spawn real subprocesses or require external resources",
]
# Hard per-test cap so a deadlocked socket/subprocess/signal test fails
# fast with a traceback at the stuck line instead of hanging the suite.
# Use thread method (not signal) so it works on Windows. Override per
# test with @pytest.mark.timeout(N) when a slow integration test
# legitimately needs more time.
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = ["quodeq"]
branch = true
omit = ["*/terminal/_pty_windows.py"]

[tool.coverage.report]
# Enforced gate (activated by --cov in CI). Ratchet this up as coverage
# improves; never lower it without justification.
fail_under = 80

[build-system]
requires = ["uv_build>=0.10.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Note: src/quodeq/static is intentionally INCLUDED so the wheel ships a
# pre-built UI. End users no longer need Node/npm at runtime. Build it
# with `tools/build-dist.sh` (runs npm ci + vite build before uv build).
# Help screenshots ship via static/ (Vite copies them there); excluding the
# source copies keeps the wheel from carrying each image twice. They stay in
# the source tarball because rebuilding the UI needs them.
wheel-exclude = [
    "src/quodeq/ui/node_modules",
    "src/quodeq/ui/src/assets/help",
]
# Keep the installed JS dependency tree (~28MB / 11k files, reproducible from
# package-lock.json) and local build cruft out of the published source tarball.
source-exclude = [
    "src/quodeq/ui/node_modules",
    "src/quodeq/ui/.mypy_cache",
    "**/.DS_Store",
]

[[tool.mypy.overrides]]
module = "winpty.*"
ignore_missing_imports = true
