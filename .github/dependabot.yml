version: 2
# Cooldown defers PRs until a release has settled, defending against
# compromised versions that get yanked within hours of publication.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#cooldown
#
# SCOPE: every `directory`/`directories` value below is deliberately narrow.
# tests/fixtures/discipline_corpus/ holds ~40 synthetic manifests (package.json,
# pyproject.toml, go.mod, Cargo.toml, Gemfile, Dockerfile, requirements.txt)
# that exist ONLY as inputs to language/framework detection tests. Their pinned
# versions are assertions. Do NOT widen these paths or use wildcards to "get
# full coverage": Dependabot would open PRs against fixtures, break detection
# tests, and bury the real updates in noise.
updates:
  # This project is uv-managed: pyproject.toml declares loose floors and
  # uv.lock holds the versions we actually ship. The "pip" ecosystem opened
  # ZERO PRs in the repo's entire history (vs 14 npm, 7 github-actions),
  # because a floor like `openai>=1.0` already permits every newer release,
  # so pip sees nothing to bump, and uv.lock is not a pip-ecosystem artifact.
  # "uv" reads uv.lock, so the 58 locked packages are finally monitored.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  - package-ecosystem: "npm"
    # package.json lives under src/quodeq/ui, not the repo root. Use the
    # `directories` (list) form: an earlier `directory:` value change (2026-05-25)
    # did not dislodge Dependabot's stale root-scoped npm version-update job,
    # which keeps failing weekly with "/package.json not found". Changing the
    # config shape forces Dependabot to re-register the ecosystem at the new path.
    directories:
      - "/src/quodeq/ui"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    # react-dom's peer dependency pins an exactly-matching react version
    # (react-dom@19.2.7 needs react@^19.2.7). Bumping one without the other in
    # separate PRs breaks `npm ci` with ERESOLVE (happened in #596/#599). Group
    # the react packages so they are always bumped together in a single PR.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
      # TanStack ships react-query and its devtools in lockstep and expects
      # matching versions. They drifted apart once already (react-query
      # 5.101.4 against react-query-devtools 5.101.3) because nothing kept
      # them together. Same failure class as react/react-dom above.
      tanstack:
        patterns:
          - "@tanstack/*"
    # eslint majors are not ours to take. eslint.config.js exists for exactly
    # one rule, eslint-plugin-react's react/jsx-no-literals, which drives the
    # i18n string ratchet in tools/check_strings.mjs. The plugin's latest
    # release (7.37.5) caps its peer range at eslint ^9.7, so eslint 10 fails
    # `npm ci` with ERESOLVE and takes the whole UI build down with it, not
    # just linting (#1036). Same class as the react/tanstack groups above, but
    # ungroupable: no published plugin version accepts eslint 10, so there is
    # no combination Dependabot could open that would install. Drop this ignore
    # once eslint-plugin-react widens its peer range.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      # github-actions does not version with semver, so Dependabot rejects the
      # semver-*-days keys for this ecosystem. Only default-days is supported.
      default-days: 3
