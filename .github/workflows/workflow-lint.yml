name: Workflow Lint

# Catches bash mistakes in GitHub Actions workflows BEFORE they ship.
# actionlint validates GH Actions YAML and shellchecks inline `run:` blocks
# natively — it would have caught the apostrophe-in-parameter-default bug
# from #260 (line 18: unexpected EOF while looking for matching `'`).

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pinned release with a pinned digest, not the download script from
      # main fetching `latest`: this job is the gate for every workflow change,
      # so it should not run code nobody reviewed. To bump, take the digest
      # from that release's actionlint_<version>_checksums.txt.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" actionlint
          ./actionlint -version

      - name: Run actionlint on all workflows
        run: ./actionlint -color -verbose
