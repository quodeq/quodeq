name: Build Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-dashboard-dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Set up signing keychain
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:" \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: no Developer ID Application identity found in imported cert"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build DMG
        run: bash packaging/macos/build-dashboard-dmg.sh

      - name: Upload DMG to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          DMG="dist/Quodeq-${VERSION}-macOS.dmg"
          if [ -f "$DMG" ]; then
            gh release upload "${{ github.event.release.tag_name }}" "$DMG" --clobber
          else
            echo "DMG not found at $DMG"
            exit 1
          fi

      - name: Upload DMG as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quodeq-dashboard-dmg
          path: dist/*.dmg

      - name: Clean up signing keychain
        if: always() && env.MACOS_CERT_P12_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Build exe
        shell: pwsh
        run: .\packaging\windows\build-exe.ps1

      - name: Smoke test exe (headless API)
        shell: pwsh
        # Boot the built bundle in headless API mode (Quodeq.exe --_api routes to
        # quodeq.api.app:main via dashboard_entry.py) and assert it serves
        # /api/health. Proves the PyInstaller bundle + bundled static UI start on
        # a clean Windows runner. Non-blocking (continue-on-error) until it has
        # been seen green on a real release, so an unverified assumption can't
        # break a release; then drop continue-on-error to gate the release,
        # mirroring how the windows-latest test job was promoted to blocking.
        continue-on-error: true
        run: |
          $exe = "dist\dashboard-build\dist\Quodeq\Quodeq.exe"
          if (-not (Test-Path $exe)) { throw "Quodeq.exe not found at $exe" }
          $env:QUODEQ_ACTION_API_HOST = "127.0.0.1"
          $env:QUODEQ_ACTION_API_PORT = "7863"
          $p = Start-Process -FilePath $exe -ArgumentList "--_api" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($p.HasExited) { throw "exe exited early (code $($p.ExitCode))" }
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7863/api/health" -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw "exe did not serve /api/health within 30s" }
            Write-Host "Packaged exe served /api/health OK"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload zip to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          ZIP="dist/Quodeq-${VERSION}-Windows.zip"
          if [ -f "$ZIP" ]; then
            gh release upload "${{ github.event.release.tag_name }}" "$ZIP" --clobber
          else
            echo "Zip not found at $ZIP"
            exit 1
          fi

      - name: Upload zip as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quodeq-windows-zip
          path: dist/*.zip
