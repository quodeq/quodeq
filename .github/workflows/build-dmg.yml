name: Build Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-dashboard-dmg:
    runs-on: macos-latest
    # Read-only: this job runs third-party build tooling next to the signing
    # secrets, so it never holds a token that can write to the release. The
    # publish-release job below uploads what it builds.
    permissions:
      contents: read
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # From the tagged source tarball with a pinned digest rather than
      # `brew install`, which takes whatever the formula points at on release
      # day. The digest matches homebrew-core's create-dmg 1.3.0 formula. To
      # bump: change both values, taking the digest from the new formula.
      - name: Install create-dmg
        env:
          CREATE_DMG_VERSION: 1.3.0
          CREATE_DMG_SHA256: c50d2bc97c3d6292642bac55f530d247eaf4bf65ee605f26b4caf339383e381c
        run: |
          SRC="$RUNNER_TEMP/create-dmg"
          mkdir -p "$SRC"
          curl -fsSL -o "$SRC/src.tar.gz" \
            "https://github.com/create-dmg/create-dmg/archive/refs/tags/v${CREATE_DMG_VERSION}.tar.gz"
          echo "${CREATE_DMG_SHA256}  $SRC/src.tar.gz" | shasum -a 256 -c -
          tar -xzf "$SRC/src.tar.gz" -C "$SRC" --strip-components=1
          make -C "$SRC" prefix="$SRC/install" install
          echo "$SRC/install/bin" >> "$GITHUB_PATH"

      - name: Set up signing keychain
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:" \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: no Developer ID Application identity found in imported cert"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build DMG
        run: bash packaging/macos/build-dashboard-dmg.sh

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quodeq-dashboard-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always() && env.MACOS_CERT_P12_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build exe
        shell: pwsh
        run: .\packaging\windows\build-exe.ps1

      - name: Smoke test exe (headless API)
        shell: pwsh
        # Boot the built bundle in headless API mode (Quodeq.exe --_api routes to
        # quodeq.api.app:main via dashboard_entry.py) and assert it serves
        # /api/health. Proves the PyInstaller bundle + bundled static UI start on
        # a clean Windows runner. Non-blocking (continue-on-error) until it has
        # been seen green on a real release, so an unverified assumption can't
        # break a release; then drop continue-on-error to gate the release,
        # mirroring how the windows-latest test job was promoted to blocking.
        continue-on-error: true
        run: |
          $exe = "dist\dashboard-build\dist\Quodeq\Quodeq.exe"
          if (-not (Test-Path $exe)) { throw "Quodeq.exe not found at $exe" }
          $env:QUODEQ_ACTION_API_HOST = "127.0.0.1"
          $env:QUODEQ_ACTION_API_PORT = "7863"
          $out = Join-Path $env:RUNNER_TEMP "quodeq-api.out.log"
          $err = Join-Path $env:RUNNER_TEMP "quodeq-api.err.log"
          $p = Start-Process -FilePath $exe -ArgumentList "--_api" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $ok = $false
          try {
            while ($sw.Elapsed.TotalSeconds -lt 120) {
              if ($p.HasExited) { Write-Host "exe exited early (code $($p.ExitCode))"; break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:7863/api/health" -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { $last = $_.Exception.Message; Start-Sleep -Seconds 1 }
            }
            if (-not $ok) {
              Write-Host "Last probe error: $last"
              $pids = @($p.Id) + @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object ProcessId)
              Write-Host "Listening sockets of exe process tree ($($pids -join ', ')):"
              Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                Where-Object { $pids -contains $_.OwningProcess } | Format-Table -AutoSize | Out-String | Write-Host
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            Write-Host "----- exe stdout -----"; if (Test-Path $out) { Get-Content $out | Write-Host }
            Write-Host "----- exe stderr -----"; if (Test-Path $err) { Get-Content $err | Write-Host }
          }
          if (-not $ok) { throw "exe did not serve /api/health within 120s" }
          Write-Host "Packaged exe served /api/health OK after $([int]$sw.Elapsed.TotalSeconds)s"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quodeq-windows-zip
          path: dist/*.zip
          if-no-files-found: error

  # The only job that can write to the release or sign attestations. It
  # gathers both builds, publishes SHA256SUMS next to them, and records
  # build provenance so `gh attestation verify` can tie each download back
  # to this workflow run (see SECURITY.md, "Verifying a release").
  publish-release:
    needs: [build-dashboard-dmg, build-windows-exe]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download desktop builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quodeq-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          ls -1 Quodeq-*-macOS.dmg Quodeq-*-Windows.zip
          shasum -a 256 Quodeq-*-macOS.dmg Quodeq-*-Windows.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/Quodeq-*-macOS.dmg
            release/Quodeq-*-Windows.zip
            release/SHA256SUMS

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            release/Quodeq-*-macOS.dmg release/Quodeq-*-Windows.zip release/SHA256SUMS

      # Runs the same checks SECURITY.md tells users to run, so a broken
      # verification path shows up on the release that broke it.
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Quodeq-*' --pattern SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          for f in Quodeq-*-macOS.dmg Quodeq-*-Windows.zip SHA256SUMS; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-dmg.yml"
          done
