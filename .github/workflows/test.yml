name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Manual escape hatch. On 2026-08-06 a GitHub incident stopped delivering
  # pull_request/push events to Actions: runs were never created, so a PR sat
  # with zero checks and no way to produce them. Run creation and the runners
  # themselves were fine, only event delivery was down. workflow_dispatch goes
  # through the API instead of the event pipeline, and its check runs attach to
  # the dispatched ref's head commit, which is where branch protection looks.
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Cap the whole job so a hanging test fails fast instead of burning
    # runner minutes. Ubuntu + macOS run in ~2-3 min. Windows is far slower
    # per test (no fork(), slow git-subprocess startup, NTFS small-file I/O,
    # Defender scanning), so it runs under pytest-xdist (-n auto) with a
    # Defender exclusion to stay well within this budget.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        # Skip @pytest.mark.integration: those spawn real subprocesses and
        # send signals, which are inherently timing-sensitive on shared CI
        # runners. They run elsewhere (e.g. nightly) where flakes are
        # tolerable. PR CI should be fast and deterministic.
        run: uv run pytest tests/ -q --tb=short -m "not integration" --cov=quodeq --cov-report=term-missing

      - name: Speed up Windows file I/O (exclude churn paths from Defender)
        if: runner.os == 'Windows'
        # The suite spawns thousands of git/python subprocesses and writes
        # thousands of tiny temp files. Defender's real-time scan of every new
        # process image and file write is a large, invisible tax on
        # windows-latest. Exclude the churn dirs and the two hot executables.
        # Best effort: never let a Defender hiccup block the gate.
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:TEMP, $env:GITHUB_WORKSPACE
          Add-MpPreference -ExclusionProcess "git.exe", "python.exe"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        # -n auto (pytest-xdist): the suite is process- and file-I/O-bound on
        # Windows, and every test is state-isolated by the autouse
        # _isolate_quodeq_home fixture (tests/conftest.py), so distributing
        # across cores cuts wall time roughly linearly (~12 min -> a few).
        # Verbose + -ra so per-test names and the FAILED summary survive
        # GitHub's log truncation, keeping this blocking gate easy to triage.
        #
        # QUODEQ_TEST_TIMEOUT_SCALE (tests/_timeouts.py): -n auto puts four
        # workers on a 4-vCPU runner, so the box is saturated and a thread can
        # miss a 5s window purely by not being scheduled. Multiply every
        # budget() wait here rather than hand-tuning ~45 call sites for the
        # slowest runner and slowing local runs down with them.
        #
        # --timeout must move with that scale. pyproject.toml caps every test
        # at 60s, which is generous on an idle box but not against 4x-scaled
        # waits on a saturated one: a runner-wide stall inflates every worker
        # at once (run 31077131601 pushed four workers 3-10x for ~100s), and
        # whichever test is mid-flight when it crosses 60s is killed. On
        # Windows pytest-timeout only has the thread method, which ends the
        # test by calling os._exit, so the worker dies without reporting and
        # xdist blames it on "worker crashed while running <test>" - a
        # segfault-shaped message for what is really a timeout. 60 * 4 keeps
        # the cap proportional to the waits it has to cover; a genuine
        # deadlock still fails inside the job's 15-minute budget.
        env:
          QUODEQ_TEST_TIMEOUT_SCALE: "4"
        run: uv run pytest tests/ -v -ra --tb=short -m "not integration" -n auto --timeout=240

  ui:
    # The web UI ships ~1600 tests (vitest .test.jsx + node:test .test.js) that
    # nothing else in CI runs; production builds only `npm run build` them. They
    # are jsdom/pure-JS and OS-independent, so one Linux runner is enough. Runs
    # in parallel with `test`, which is far slower, so it adds no wall time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          # 22, not 20: the `test` script runs `node --test` with a glob
          # pattern, and node only expands glob args to --test on 21+.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/quodeq/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: src/quodeq/ui
        run: npm ci

      - name: Run UI tests
        working-directory: src/quodeq/ui
        # test:all = node --test (.test.js) + vitest run (.test.jsx).
        run: npm run test:all

      - name: Check hardcoded UI strings (i18n ratchet)
        working-directory: src/quodeq/ui
        # Fails on user-visible string literals not in tools/strings_baseline.json.
        # New strings go in src/strings/en.json via t(); shrunk counts are locked
        # in with `npm run lint:strings:update`.
        run: npm run lint:strings

      - name: Check UI file/function sizes (size ratchet)
        working-directory: src/quodeq/ui
        # Fails on files/functions over 300/50 lines outside the grandfather
        # list in tools/size_grandfather.mjs, or a grandfather list that grew
        # past its committed ceiling.
        run: npm run lint:size
